name: Small Project Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print System Info
        run: |
          echo "Running on machine: $(uname -a)"
          echo "Current working directory: $(pwd)"

      - name: Run a small build script
        run: |
          echo "Creating a greeting script..."
          echo 'echo "Hello from GitHub Actions Self-Hosted Runner!"' > script.sh
          chmod +x script.sh
          ./script.sh
